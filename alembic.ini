[alembic]
script_location = agent_mcp/db/migrations_pg
prepend_sys_path = .
path_separator = os

# sqlalchemy.url is intentionally omitted here: agent_mcp/db/pg_bootstrap.py
# sets it at runtime from the DATABASE_URL environment variable, so the
# secret never lives in a checked-in config file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
